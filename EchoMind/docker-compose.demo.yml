# Python-only demo: use with docker-compose.yml and start only the listed services.
# docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build redis chromadb echomind frontend
services:
  echomind:
    env_file:
      - .env
      - .env.demo

  frontend:
    build:
      context: ../EchoMindFrontend
      dockerfile: Dockerfile
      args:
        VITE_PYTHON_ONLY: "true"
        NGINX_IMAGE: nginx:alpine
    container_name: echomind-demo-web
    environment:
      PYTHON_API_URL: /api/python
    ports:
      - "127.0.0.1:5176:80"
    volumes:
      - ./config/nginx/frontend-python.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      echomind:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - echomind-network
